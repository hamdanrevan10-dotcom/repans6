name: Build Repan6 EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-repan6:
    runs-on: windows-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Compile C++ menjadi EXE
        run: g++ -static "repan6.cpp" -o "repan6.exe"

      - name: Upload file EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-repan6
          path: "repan6.exe"
